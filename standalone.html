<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0d18" />
  <title>Elemental Defense</title>
  <style>
:root {
  --bg: #0b0d18;
  --panel: rgba(14, 18, 34, 0.9);
  --panel-edge: #2a3358;
  --text: #e6ecff;
  --text-dim: #8a93b5;
  --gold: #ffcc55;
  --lives: #ff6b6b;
  --wave: #6ec8ff;
  --accent: #8a7cff;
  --good: #6fe28a;
  --bad: #ff5577;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  overscroll-behavior: none;
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  background: #060814;
  touch-action: none;
}

/* HUD top */
#hud-top {
  position: absolute;
  top: env(safe-area-inset-top, 0);
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  pointer-events: none;
  z-index: 10;
}
#hud-top .stat {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 6px 12px;
  font-weight: 700;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 70px;
  justify-content: center;
  backdrop-filter: blur(6px);
}
#hud-top .ico {
  font-size: 12px;
  font-weight: 800;
  width: 18px; height: 18px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  color: #0b0d18;
}
#stat-gold .ico { background: var(--gold); }
#stat-lives .ico { background: var(--lives); }
#stat-wave  .ico { background: var(--wave); }

/* HUD bottom */
#hud-bottom {
  position: absolute;
  bottom: env(safe-area-inset-bottom, 0);
  left: 0; right: 0;
  padding: 8px 10px 12px;
  z-index: 10;
}

#tower-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}

.tower-btn {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 12px;
  padding: 10px 4px 8px;
  text-align: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.08s, border-color 0.08s, background 0.08s;
}
.tower-btn:active { transform: scale(0.95); }
.tower-btn.selected {
  border-color: var(--accent);
  background: rgba(138, 124, 255, 0.18);
  box-shadow: 0 0 0 1px var(--accent), 0 0 18px rgba(138,124,255,0.35) inset;
}
.tower-btn.disabled {
  opacity: 0.45;
  filter: grayscale(0.6);
}
.tower-btn .icon {
  width: 36px; height: 36px;
  margin: 0 auto 4px;
  border-radius: 8px;
  display: block;
}
.tower-btn .name {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-dim);
}
.tower-btn .cost {
  font-size: 12px;
  font-weight: 800;
  color: var(--gold);
  margin-top: 2px;
}

#action-bar {
  display: flex;
  gap: 8px;
}
.action {
  flex: 1;
  background: linear-gradient(180deg, #2a3a78, #18234d);
  color: var(--text);
  border: 1px solid var(--panel-edge);
  border-radius: 12px;
  padding: 12px;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: transform 0.08s, filter 0.08s;
}
.action:active { transform: scale(0.97); }
.action.small { flex: 0 0 60px; }
#btn-start.ready {
  background: linear-gradient(180deg, #2bd06b, #0f7e3c);
  box-shadow: 0 0 20px rgba(43, 208, 107, 0.4);
}
#btn-start.in-wave {
  background: linear-gradient(180deg, #2a3a78, #18234d);
  opacity: 0.7;
}

/* Selection panel */
#selection-panel {
  position: absolute;
  left: 10px; right: 10px;
  bottom: calc(env(safe-area-inset-bottom, 0) + 168px);
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 14px;
  padding: 10px 12px;
  z-index: 9;
  backdrop-filter: blur(10px);
}
#selection-panel.hidden { display: none; }
.sel-title {
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 1px;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.sel-title .lvl { color: var(--accent); font-size: 12px; }
.sel-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--text-dim);
}
.sel-stats div span { color: var(--text); font-weight: 700; }
.sel-actions {
  display: flex;
  gap: 8px;
}
.sel-actions button {
  flex: 1;
  background: linear-gradient(180deg, #2a3a78, #18234d);
  color: var(--text);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 10px;
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
}
#btn-upgrade { background: linear-gradient(180deg, #6c47d6, #3a2a85); }
#btn-upgrade.disabled, .sel-actions button.disabled { opacity: 0.4; pointer-events: none; }
#btn-sell { background: linear-gradient(180deg, #b34a4a, #5c2222); }

/* Floating message */
#message {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  padding: 8px 16px;
  border-radius: 10px;
  font-weight: 700;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
}
#message.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#message.hidden { display: none; }
#message.warn { color: var(--bad); }
#message.good { color: var(--good); }

/* Overlay */
#overlay {
  position: absolute;
  inset: 0;
  background: rgba(6, 8, 20, 0.85);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
}
#overlay.hidden { display: none; }
.overlay-content {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 16px;
  padding: 28px;
  text-align: center;
  max-width: 320px;
  width: calc(100% - 40px);
}
.overlay-content h1 {
  margin: 0 0 8px;
  font-size: 24px;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: linear-gradient(90deg, #ffcc55, #8a7cff, #6ec8ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.overlay-content p {
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.5;
  margin: 0 0 18px;
}
.overlay-content button {
  background: linear-gradient(180deg, #2bd06b, #0f7e3c);
  color: white;
  border: none;
  padding: 14px 36px;
  font-weight: 800;
  letter-spacing: 2px;
  font-size: 14px;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(43, 208, 107, 0.4);
}
  </style>

  <script type="module">
// ============================================================
// config.js
// ============================================================

// Game-wide configuration. Tune these to balance the game.

const GRID = {

      { dmg: 48, range: 2.8, fireRate: 0.65, stunDur: 0.30, projSpeed: 13, projColor: "#d6aa54" },
      { dmg: 84, range: 3.0, fireRate: 0.75, stunDur: 0.40, projSpeed: 14, projColor: "#e6ba62" },

      { dmg: 16, range: 3.8, fireRate: 1.6, chain: 3, chainRange: 2.0, projSpeed: 24, projColor: "#d7baff" },
      { dmg: 28, range: 4.1, fireRate: 1.8, chain: 4, chainRange: 2.3, projSpeed: 26, projColor: "#e1c9ff" },
      { dmg: 50, range: 4.5, fireRate: 2.0, chain: 5, chainRange: 2.7, projSpeed: 28, projColor: "#ecdaff" },

};

const TOWER_ORDER = ["fire", "water", "earth", "air", "ether"];

// Upgrade cost: base * multiplier^(level)
const UPGRADE = {
  multipliers: [1.5, 2.0, 2.8, 4.0], // L1->L2, L2->L3, L3->L4, L4->L5
  sellRefund: 0.7, // % of total spent returned on sell
};

// Wave / economy tuning. Round 1 starting gold = 100,
// which buys 5 base towers (20g each) OR 3 towers + 1 upgrade (~60+30=90).
const ECONOMY = {
  startingGold: 100,
  startingLives: 20,
  enemyKillReward: 2,         // gold per kill, scales with hp tier
  waveCompleteBonus: 25,      // flat bonus per wave
  waveCompleteScale: 8,       // + (wave * scale)
};

const ENEMIES = {
  // Base enemy template; per-wave we scale hp/speed/count
  grunt: { color: "#aaaaaa", radius: 0.32, baseHp: 18, baseSpeed: 2.0, reward: 2, lives: 1 },
  runner:{ color: "#7af0a0", radius: 0.26, baseHp: 12, baseSpeed: 3.6, reward: 2, lives: 1 },
  tank:  { color: "#7c93ff", radius: 0.42, baseHp: 60, baseSpeed: 1.4, reward: 5, lives: 2 },
  swarm: { color: "#ffcc55", radius: 0.20, baseHp: 7,  baseSpeed: 2.6, reward: 1, lives: 1 },
  boss:  { color: "#ff5577", radius: 0.55, baseHp: 350,baseSpeed: 1.2, reward: 30, lives: 5 },

// ============================================================
// pathfinding.js
// ============================================================

// A* pathfinding on the tile grid.
// Returns an array of {col, row} from start to goal, or null if no path exists.

function findPath(grid, start, goal) {
  const cols = grid.cols;
  const rows = grid.rows;
  if (!inBounds(start, cols, rows) || !inBounds(goal, cols, rows)) return null;

  const key = (c, r) => r * cols + c;

  const open = new MinHeap();
  const cameFrom = new Map();
  const gScore = new Map();
  const fScore = new Map();
  const closed = new Set();

  const startKey = key(start.col, start.row);
  gScore.set(startKey, 0);
  fScore.set(startKey, heuristic(start, goal));
  open.push({ key: startKey, col: start.col, row: start.row, f: fScore.get(startKey) });

  while (open.size() > 0) {
    const current = open.pop();
    if (closed.has(current.key)) continue; // stale heap entry
    if (current.col === goal.col && current.row === goal.row) {
      return reconstruct(cameFrom, current, cols);
    }
    closed.add(current.key);

    // 4-directional movement (no diagonals — keeps walls honest)
    const neighbors = [
      { col: current.col + 1, row: current.row },
      { col: current.col - 1, row: current.row },
      { col: current.col, row: current.row + 1 },
      { col: current.col, row: current.row - 1 },
    ];

    for (const n of neighbors) {
      if (!inBounds(n, cols, rows)) continue;
      // Goal is always reachable even if blocked (so enemies can exit)
      const isGoal = n.col === goal.col && n.row === goal.row;
      if (!isGoal && grid.isBlocked(n.col, n.row)) continue;
      const nKey = key(n.col, n.row);
      if (closed.has(nKey)) continue;

      const tentativeG = (gScore.get(current.key) ?? Infinity) + 1;
      if (tentativeG < (gScore.get(nKey) ?? Infinity)) {
        cameFrom.set(nKey, current);
        gScore.set(nKey, tentativeG);
        const f = tentativeG + heuristic(n, goal);
        fScore.set(nKey, f);
        open.push({ key: nKey, col: n.col, row: n.row, f });
      }
    }
  }

  return null;
}

function inBounds(p, cols, rows) {
  return p.col >= 0 && p.col < cols && p.row >= 0 && p.row < rows;
}

function heuristic(a, b) {
  // Manhattan
  return Math.abs(a.col - b.col) + Math.abs(a.row - b.row);
}

function reconstruct(cameFrom, current, cols) {
  const path = [{ col: current.col, row: current.row }];
  let key = current.key;
  while (cameFrom.has(key)) {
    const prev = cameFrom.get(key);
    path.push({ col: prev.col, row: prev.row });
    key = prev.key;
  }
  path.reverse();
  return path;
}

// --- Min-heap keyed by .f ---
class MinHeap {
  constructor() { this.data = []; }
  size() { return this.data.length; }
  push(item) {
    this.data.push(item);
    this._siftUp(this.data.length - 1);
  }
  pop() {
    const top = this.data[0];
    const last = this.data.pop();
    if (this.data.length > 0) {
      this.data[0] = last;
      this._siftDown(0);
    }
    return top;
  }
  _siftUp(i) {
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.data[p].f <= this.data[i].f) break;
      [this.data[p], this.data[i]] = [this.data[i], this.data[p]];
      i = p;
    }
  }
  _siftDown(i) {
    const n = this.data.length;
    while (true) {
      const l = i * 2 + 1, r = l + 1;
      let s = i;
      if (l < n && this.data[l].f < this.data[s].f) s = l;
      if (r < n && this.data[r].f < this.data[s].f) s = r;
      if (s === i) break;
      [this.data[s], this.data[i]] = [this.data[i], this.data[s]];
      i = s;
    }
  }
}

// ============================================================
// grid.js
// ============================================================

class Grid {
  constructor() {
    this.cols = GRID.cols;
    this.rows = GRID.rows;
    this.tile = GRID.tileSize;
    this.spawn = { col: GRID.spawnCol, row: 0 };
    this.exit  = { col: GRID.exitCol,  row: this.rows - 1 };
    this.cells = new Array(this.cols * this.rows).fill(null); // tower or null
    this._cachedPath = null;
  }

  worldWidth()  { return this.cols * this.tile; }
  worldHeight() { return this.rows * this.tile; }

  idx(c, r) { return r * this.cols + c; }
  inBounds(c, r) { return c >= 0 && c < this.cols && r >= 0 && r < this.rows; }

  getTower(c, r) {
    if (!this.inBounds(c, r)) return null;
    return this.cells[this.idx(c, r)];
  }

  isBlocked(c, r) {
    if (!this.inBounds(c, r)) return true;
    return this.cells[this.idx(c, r)] !== null;
  }

  // Spawn/exit cells must remain walkable
  isReserved(c, r) {
    return (c === this.spawn.col && r === this.spawn.row) ||
           (c === this.exit.col  && r === this.exit.row);
  }

  // Try to place a tower; reject if it would block the path entirely.
  canPlace(c, r) {
    if (!this.inBounds(c, r)) return false;
    if (this.isReserved(c, r)) return false;
    if (this.cells[this.idx(c, r)] !== null) return false;
    // Provisionally block and re-pathfind. If unreachable, reject.
    this.cells[this.idx(c, r)] = { __probe: true };
    const path = findPath(this, this.spawn, this.exit);
    this.cells[this.idx(c, r)] = null;
    return path !== null;
  }

  placeTower(c, r, tower) {
    if (!this.canPlace(c, r)) return false;
    this.cells[this.idx(c, r)] = tower;
    tower.col = c; tower.row = r;
    this._cachedPath = null;
    return true;
  }

  removeTower(c, r) {
    if (!this.inBounds(c, r)) return null;
    const t = this.cells[this.idx(c, r)];
    this.cells[this.idx(c, r)] = null;
    if (t) this._cachedPath = null;
    return t;
  }

  computePath() {
    if (this._cachedPath) return this._cachedPath;
    this._cachedPath = findPath(this, this.spawn, this.exit);
    return this._cachedPath;
  }

  invalidatePath() { this._cachedPath = null; }

  worldToCell(wx, wy) {
    return {
      col: Math.floor(wx / this.tile),
      row: Math.floor(wy / this.tile),
    };
  }

  cellCenterWorld(c, r) {
    return {
      x: c * this.tile + this.tile / 2,
      y: r * this.tile + this.tile / 2,
    };
  }

  forEachTower(fn) {
    for (let i = 0; i < this.cells.length; i++) {
      const t = this.cells[i];
      if (t) fn(t);
    }
  }
}

// Camera handles world<->screen transforms, zoom, pan, and inertia.
class Camera {
  constructor(grid) {
    this.grid = grid;
    this.x = grid.worldWidth() / 2;   // world coord at viewport center
    this.y = grid.worldHeight() / 2;
    this.zoom = 1;                     // computed in resize()
    this.minZoom = 1;
    this.maxZoom = CAMERA.maxZoom;
    this.viewW = 1;
    this.viewH = 1;
    this.vx = 0; this.vy = 0;          // pan inertia in world units / sec
  }

  resize(viewW, viewH) {
    this.viewW = viewW;
    this.viewH = viewH;
    // Min zoom = whichever axis fits the entire grid into the viewport.
    const ww = this.grid.worldWidth();
    const wh = this.grid.worldHeight();
    this.minZoom = Math.min(viewW / ww, viewH / wh);
    if (this.zoom < this.minZoom) this.zoom = this.minZoom;
    if (this.zoom > this.maxZoom) this.zoom = this.maxZoom;
    this.clamp();
  }

  // Convert screen pixel -> world pixel
  screenToWorld(sx, sy) {
    return {
      x: this.x + (sx - this.viewW / 2) / this.zoom,
      y: this.y + (sy - this.viewH / 2) / this.zoom,
    };
  }

  worldToScreen(wx, wy) {
    return {
      x: (wx - this.x) * this.zoom + this.viewW / 2,
      y: (wy - this.y) * this.zoom + this.viewH / 2,
    };
  }

  // Pan by screen delta (i.e. drag).
  panScreen(dx, dy) {
    this.x -= dx / this.zoom;
    this.y -= dy / this.zoom;
    this.clamp();
  }

  // Zoom around a screen anchor point (so pinch zooms toward fingers).
  zoomAt(sx, sy, factor) {
    const before = this.screenToWorld(sx, sy);
    let nz = this.zoom * factor;
    nz = Math.max(this.minZoom, Math.min(this.maxZoom, nz));
    this.zoom = nz;
    const after = this.screenToWorld(sx, sy);
    this.x += before.x - after.x;
    this.y += before.y - after.y;
    this.clamp();
  }

  // Constrain camera so we never see outside the world (when zoomed past min).
  clamp() {
    const halfW = this.viewW / (2 * this.zoom);
    const halfH = this.viewH / (2 * this.zoom);
    const ww = this.grid.worldWidth();
    const wh = this.grid.worldHeight();

    if (ww * this.zoom <= this.viewW) {
      this.x = ww / 2;
    } else {
      this.x = Math.max(halfW, Math.min(ww - halfW, this.x));
    }
    if (wh * this.zoom <= this.viewH) {
      this.y = wh / 2;
    } else {
      this.y = Math.max(halfH, Math.min(wh - halfH, this.y));
    }
  }

  applyInertia(dt) {
    if (Math.abs(this.vx) < 0.5 && Math.abs(this.vy) < 0.5) {
      this.vx = 0; this.vy = 0; return;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vx *= Math.pow(CAMERA.panFriction, dt * 60);
    this.vy *= Math.pow(CAMERA.panFriction, dt * 60);
    this.clamp();
  }

  setInertia(vx, vy) { this.vx = vx; this.vy = vy; }
}

// input.js

// Pointer input: pan, pinch zoom, tap. Works for mouse, touch, and stylus.
class InputManager {
  constructor(canvas, camera, onTap) {
    this.canvas = canvas;
    this.camera = camera;
    this.onTap = onTap;       // (worldX, worldY, screenX, screenY) => void
    this.pointers = new Map();
    this._lastPanX = 0;
    this._lastPanY = 0;
    this._panSamples = [];
    this._lastPinchDist = 0;
    this._tapStart = null;
    this._dragged = false;

    canvas.addEventListener("pointerdown", this._onDown);
    canvas.addEventListener("pointermove", this._onMove);
    canvas.addEventListener("pointerup", this._onUp);
    canvas.addEventListener("pointercancel", this._onUp);
    canvas.addEventListener("wheel", this._onWheel, { passive: false });
    // Prevent context menu / gesture events from interfering on iOS
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("gesturestart", (e) => e.preventDefault());
  }

  _localPoint(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (this.canvas.width / rect.width),
      y: (e.clientY - rect.top) * (this.canvas.height / rect.height),
    };
  }

  _onDown = (e) => {
    e.preventDefault();
    this.canvas.setPointerCapture(e.pointerId);
    const p = this._localPoint(e);
    this.pointers.set(e.pointerId, p);

    if (this.pointers.size === 1) {
      this._lastPanX = p.x;
      this._lastPanY = p.y;
      this._panSamples = [];
      this._tapStart = { x: p.x, y: p.y, t: performance.now() };
      this._dragged = false;
      this.camera.setInertia(0, 0);
    } else if (this.pointers.size === 2) {
      const pts = [...this.pointers.values()];
      this._lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      this._tapStart = null;
    }
  };

  _onMove = (e) => {
    if (!this.pointers.has(e.pointerId)) return;
    e.preventDefault();
    const p = this._localPoint(e);
    this.pointers.set(e.pointerId, p);

    if (this.pointers.size === 1) {
      const dx = p.x - this._lastPanX;
      const dy = p.y - this._lastPanY;
      if (Math.abs(dx) + Math.abs(dy) > 4) this._dragged = true;
      this.camera.panScreen(dx, dy);
      this._panSamples.push({ dx, dy, t: performance.now() });
      if (this._panSamples.length > 5) this._panSamples.shift();
      this._lastPanX = p.x;
      this._lastPanY = p.y;
    } else if (this.pointers.size === 2) {
      const pts = [...this.pointers.values()];
      const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      const cx = (pts[0].x + pts[1].x) / 2;
      const cy = (pts[0].y + pts[1].y) / 2;
      if (this._lastPinchDist > 0) {
        const factor = dist / this._lastPinchDist;
        this.camera.zoomAt(cx, cy, factor);
      }
      this._lastPinchDist = dist;
    }
  };

  _onUp = (e) => {
    if (!this.pointers.has(e.pointerId)) return;
    e.preventDefault();
    const p = this.pointers.get(e.pointerId);
    this.pointers.delete(e.pointerId);

    if (this.pointers.size === 0) {
      // Pan inertia from recent samples
      if (this._panSamples.length > 0) {
        const now = performance.now();
        const recent = this._panSamples.filter(s => now - s.t < 80);
        if (recent.length > 0) {
          const sumDx = recent.reduce((a, s) => a + s.dx, 0);
          const sumDy = recent.reduce((a, s) => a + s.dy, 0);
          const dt = Math.max(16, now - recent[0].t) / 1000;
          // inertia in world units / sec
          const vx = -(sumDx / dt) / this.camera.zoom;
          const vy = -(sumDy / dt) / this.camera.zoom;
          this.camera.setInertia(vx, vy);
        }
      }

      // Tap detection
      if (!this._dragged && this._tapStart) {
        const dur = performance.now() - this._tapStart.t;
        if (dur < 300) {
          const w = this.camera.screenToWorld(p.x, p.y);
          this.onTap(w.x, w.y, p.x, p.y);
        }
      }
      this._tapStart = null;
    } else if (this.pointers.size === 1) {
      const pt = [...this.pointers.values()][0];
      this._lastPanX = pt.x;
      this._lastPanY = pt.y;
      this._lastPinchDist = 0;
    }
  };

  _onWheel = (e) => {
    e.preventDefault();
    const p = this._localPoint(e);
    const factor = Math.exp(-e.deltaY * CAMERA.zoomSpeed);
    this.camera.zoomAt(p.x, p.y, factor);
  };
}

// tower.js
// ============================================================

class Tower {
  constructor(typeId, col, row) {
    this.type = TOWERS[typeId];
    this.typeId = typeId;
    this.col = col;
    this.row = row;
    this.level = 1;
    this.cooldown = 0;
    this.angle = 0;
    this.totalSpent = this.type.cost;
    this.firePulse = 0;
  }

  stats() { return this.type.levels[this.level - 1]; }

  upgradeCost() {
    if (this.level >= 5) return null;
    const mult = UPGRADE.multipliers[this.level - 1];
    return Math.round(this.type.cost * mult);
  }

  sellValue() {
    return Math.floor(this.totalSpent * UPGRADE.sellRefund);
  }

  upgrade() {
    if (this.level >= 5) return false;
    this.totalSpent += this.upgradeCost();
    this.level++;
    return true;
  }

  centerWorld() {
    return {
      x: this.col * GRID.tileSize + GRID.tileSize / 2,
      y: this.row * GRID.tileSize + GRID.tileSize / 2,
    };
  }

  rangeWorld() { return this.stats().range * GRID.tileSize; }

  // Find nearest enemy in range. Returns enemy or null.
  pickTarget(enemies) {
    const c = this.centerWorld();
    const r = this.rangeWorld();
    let best = null;
    let bestProgress = -Infinity;
    for (const e of enemies) {
      if (e.dead || e.escaped) continue;
      const dx = e.x - c.x, dy = e.y - c.y;
      if (dx * dx + dy * dy > r * r) continue;
      // Prefer enemies closest to the exit (highest progress).
      if (e.progress > bestProgress) {
        best = e; bestProgress = e.progress;
      }
    }
    return best;
  }

  update(dt, enemies, projectiles) {
    this.cooldown -= dt;
    if (this.firePulse > 0) this.firePulse -= dt;
    if (this.cooldown > 0) return;

    const target = this.pickTarget(enemies);
    if (!target) return;

    const c = this.centerWorld();
    const dx = target.x - c.x, dy = target.y - c.y;
    this.angle = Math.atan2(dy, dx);

    const s = this.stats();
    this.cooldown = 1 / s.fireRate;
    this.firePulse = 0.12;

    // Lead target a tiny bit using its current velocity.
    const lead = this._predict(target, c, s.projSpeed);
    projectiles.push(new Projectile(this, c.x, c.y, lead.x, lead.y, target));
  }

  _predict(target, from, projSpeed) {
    // Solve for where target will be when projectile arrives, iteratively.
    const tilesPerSec = projSpeed; // projSpeed is in tiles/sec; convert later in projectile
    // For simplicity, do one-step prediction.
    const dx = target.x - from.x;
    const dy = target.y - from.y;
    const dist = Math.hypot(dx, dy);
    const t = dist / (projSpeed * GRID.tileSize);
    return { x: target.x + (target.vx || 0) * t, y: target.y + (target.vy || 0) * t };
  }
}

// ============================================================
// projectile.js
// ============================================================

class Projectile {
  constructor(tower, x, y, tx, ty, target) {
    this.tower = tower;
    this.typeId = tower.typeId;
    this.x = x; this.y = y;
    this.target = target;
    this.dead = false;
    const s = tower.stats();
    this.dmg = s.dmg;
    this.splash = s.splash || 0;          // in tiles
    this.slow = s.slow || 0;              // 0..1
    this.slowDur = s.slowDur || 0;
    this.stunDur = s.stunDur || 0;
    this.chain = s.chain || 0;
    this.chainRange = (s.chainRange || 0) * GRID.tileSize;
    this.color = s.projColor;
    this.speed = s.projSpeed * GRID.tileSize; // world px / sec
    const dx = tx - x, dy = ty - y;
    const d = Math.hypot(dx, dy) || 1;
    this.vx = dx / d * this.speed;
    this.vy = dy / d * this.speed;
    this.life = 2.5;
    this.trail = [];
  }

  update(dt, enemies, effects) {
    if (this.dead) return;
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }

    // Track straight; for chain (ether) and homing-ish, mild homing.
    if (this.target && !this.target.dead && !this.target.escaped) {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const d = Math.hypot(dx, dy) || 1;
      // Light homing
      const homing = (this.typeId === "ether" || this.typeId === "water") ? 0.18 : 0.05;
      this.vx = this.vx * (1 - homing) + (dx / d * this.speed) * homing;
      this.vy = this.vy * (1 - homing) + (dy / d * this.speed) * homing;
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.trail.push({ x: this.x, y: this.y, t: 0.18 });
    if (this.trail.length > 8) this.trail.shift();
    for (const p of this.trail) p.t -= dt;

    // Hit detection: nearest enemy within hit radius
    const hitR = 0.45 * GRID.tileSize;
    let hit = null;
    let bestD = hitR * hitR;
    for (const e of enemies) {
      if (e.dead || e.escaped) continue;
      const dx = e.x - this.x, dy = e.y - this.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestD) { bestD = d2; hit = e; }
    }
    if (!hit) return;

    // Apply effects
    this._applyHit(hit, enemies, effects);
    this.dead = true;
  }

  _applyHit(target, enemies, effects) {
    const apply = (e, mult = 1) => {
      e.takeDamage(this.dmg * mult);
      if (this.slow > 0) e.applySlow(this.slow, this.slowDur);
      if (this.stunDur > 0) e.applyStun(this.stunDur);
    };

    apply(target, 1);
    effects.push({ type: "hit", x: target.x, y: target.y, color: this.color, t: 0.3, max: 0.3, r: GRID.tileSize * 0.4 });

    // Splash (fire)
    if (this.splash > 0) {
      const r = this.splash * GRID.tileSize;
      const r2 = r * r;
      for (const e of enemies) {
        if (e === target || e.dead || e.escaped) continue;
        const dx = e.x - target.x, dy = e.y - target.y;
        if (dx * dx + dy * dy <= r2) apply(e, 0.6);
      }
      effects.push({ type: "splash", x: target.x, y: target.y, color: this.color, t: 0.45, max: 0.45, r });
    }

    // Chain (ether)
    if (this.chain > 0) {
      let prev = target;
      const hitSet = new Set([target]);
      for (let i = 0; i < this.chain; i++) {
        let next = null;
        let bestD = this.chainRange * this.chainRange;
        for (const e of enemies) {
          if (hitSet.has(e) || e.dead || e.escaped) continue;
          const dx = e.x - prev.x, dy = e.y - prev.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestD) { bestD = d2; next = e; }
        }
        if (!next) break;
        apply(next, 0.7);
        effects.push({ type: "chain", x1: prev.x, y1: prev.y, x2: next.x, y2: next.y, color: this.color, t: 0.18, max: 0.18 });
        hitSet.add(next);
        prev = next;
      }
    }
  }
}

// ============================================================
// enemy.js
// ============================================================

class Enemy {
  constructor(typeId, hp, speed, reward, lives) {
    const t = ENEMIES[typeId];
    this.typeId = typeId;
    this.color = t.color;
    this.radius = t.radius * GRID.tileSize;
    this.maxHp = hp;
    this.hp = hp;
    this.speed = speed;       // tiles per second
    this.reward = reward;
    this.livesCost = lives;

    // Spawn at top entry tile
    const spawn = { col: GRID.spawnCol, row: 0 };
    this.x = spawn.col * GRID.tileSize + GRID.tileSize / 2;
    this.y = spawn.row * GRID.tileSize + GRID.tileSize / 2;
    this.vx = 0; this.vy = 0;

    this.path = null;
    this.pathIndex = 1; // 0 is current cell
    this.dead = false;
    this.escaped = false;

    this.slow = 0;        // 0..1 fraction (0.6 = move at 40%)
    this.slowTimer = 0;
    this.stunTimer = 0;

    this.progress = 0;    // approximate distance traveled (used by tower targeting)
    this.flash = 0;
  }

  setPath(path) {
    if (!path || path.length === 0) return;
    // Try exact cell match first; fall back to nearest cell on the path.
    const cellCol = Math.floor(this.x / GRID.tileSize);
    const cellRow = Math.floor(this.y / GRID.tileSize);
    let idx = -1;
    for (let i = 0; i < path.length; i++) {
      if (path[i].col === cellCol && path[i].row === cellRow) { idx = i; break; }
    }
    if (idx === -1) {
      // Closest by world distance, but only forward of the start.
      let bestI = 0, bestD = Infinity;
      for (let i = 0; i < path.length; i++) {
        const px = path[i].col * GRID.tileSize + GRID.tileSize / 2;
        const py = path[i].row * GRID.tileSize + GRID.tileSize / 2;
        const d = (px - this.x) ** 2 + (py - this.y) ** 2;
        if (d < bestD) { bestD = d; bestI = i; }
      }
      idx = bestI;
    }
    this.path = path;
    this.pathIndex = Math.min(path.length - 1, idx + 1);
  }

  takeDamage(dmg) {
    if (this.dead) return;
    this.hp -= dmg;
    this.flash = 0.12;
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
    }
  }

  applySlow(amount, duration) {
    if (amount > this.slow) this.slow = amount;
    this.slowTimer = Math.max(this.slowTimer, duration);
  }

  applyStun(duration) {
    this.stunTimer = Math.max(this.stunTimer, duration);
  }

  update(dt) {
    if (this.dead || this.escaped) return;
    if (this.flash > 0) this.flash -= dt;

    if (this.stunTimer > 0) {
      this.stunTimer -= dt;
      this.vx = 0; this.vy = 0;
      return;
    }

    if (this.slowTimer > 0) {
      this.slowTimer -= dt;
      if (this.slowTimer <= 0) this.slow = 0;
    }

    if (!this.path || this.pathIndex >= this.path.length) {
      this.escaped = true;
      return;
    }

    const target = this.path[this.pathIndex];
    const tx = target.col * GRID.tileSize + GRID.tileSize / 2;
    const ty = target.row * GRID.tileSize + GRID.tileSize / 2;
    const dx = tx - this.x, dy = ty - this.y;
    const d = Math.hypot(dx, dy);
    const speedFactor = 1 - this.slow;
    const v = this.speed * GRID.tileSize * speedFactor;
    const step = v * dt;

    if (step >= d) {
      this.x = tx; this.y = ty;
      this.progress += d;
      this.pathIndex++;
      if (this.pathIndex >= this.path.length) {
        // Check if reached the exit cell
        const last = this.path[this.path.length - 1];
        const exit = { col: GRID.exitCol, row: GRID.rows - 1 };
        if (last.col === exit.col && last.row === exit.row) {
          this.escaped = true;
        }
      }
      this.vx = 0; this.vy = 0;
    } else {
      const nx = dx / d, ny = dy / d;
      this.x += nx * step;
      this.y += ny * step;
      this.progress += step;
      this.vx = nx * v;
      this.vy = ny * v;
    }
  }
}

// wave.js
// ============================================================

// Generate wave composition. Difficulty scales smoothly.
// Designed so income roughly equals (towers buildable + occasional upgrade).
function buildWave(waveNum) {
  const w = waveNum;
  const isBoss = w % 10 === 0;

  // Base count: starts at 8, grows with wave
  const count = Math.floor(6 + w * 1.6);

  // hp/speed scaling
  const hpScale = Math.pow(1.18, w - 1);
  const speedScale = 1 + Math.min(0.6, w * 0.025);

  // Assemble enemies
  const enemies = [];
  // Base grunt mix
  for (let i = 0; i < count; i++) {
    let typeId = "grunt";
    const roll = Math.random();
    if (w >= 2 && roll < 0.25) typeId = "swarm";
    if (w >= 3 && roll >= 0.25 && roll < 0.45) typeId = "runner";
    if (w >= 5 && roll >= 0.45 && roll < 0.62) typeId = "tank";

    const t = ENEMIES[typeId];
    enemies.push({
      typeId,
      hp: Math.round(t.baseHp * hpScale),
      speed: t.baseSpeed * (typeId === "swarm" ? speedScale * 1.05 : speedScale),
      reward: t.reward,
      lives: t.lives,
      delay: 0.45 + Math.random() * 0.25, // seconds between spawns
    });
  }
  // Boss every 10 waves
  if (isBoss) {
    const t = ENEMIES.boss;
    enemies.push({
      typeId: "boss",
      hp: Math.round(t.baseHp * hpScale * (1 + w / 20)),
      speed: t.baseSpeed * speedScale,
      reward: t.reward,
      lives: t.lives,
      delay: 1.2,
    });
  }

  // Swarm bursts: occasional close-spaced spawns
  for (let i = 1; i < enemies.length; i++) {
    if (enemies[i].typeId === "swarm" && enemies[i - 1].typeId === "swarm") {
      enemies[i].delay = 0.18;
    }
  }

  return enemies;
}

// Manages spawning over time.
class WaveRunner {
  constructor(spec) {
    this.spec = spec;            // array of enemy descriptors with .delay
    this.index = 0;
    this.timer = 0;
    this.done = false;
  }

  update(dt, onSpawn) {
    if (this.done) return;
    this.timer -= dt;
    while (this.timer <= 0 && this.index < this.spec.length) {
      const desc = this.spec[this.index];
      const e = new Enemy(desc.typeId, desc.hp, desc.speed, desc.reward, desc.lives);
      onSpawn(e);
      this.index++;
      if (this.index < this.spec.length) {
        this.timer += this.spec[this.index].delay;
      } else {
        this.done = true;
      }
    }
  }
}

    this.selLevel = document.getElementById("sel-level");
    this.selDmg = document.getElementById("sel-dmg");
    this.selRng = document.getElementById("sel-rng");
    this.selRpm = document.getElementById("sel-rpm");
    this.btnUpgrade = document.getElementById("btn-upgrade");
    this.upgradeCost = document.getElementById("upgrade-cost");
    this.btnSell = document.getElementById("btn-sell");
    this.sellValue = document.getElementById("sell-value");
    this.message = document.getElementById("message");
    this.overlay = document.getElementById("overlay");
    this.overlayTitle = document.getElementById("overlay-title");
    this.overlayText = document.getElementById("overlay-text");
    this.btnOverlay = document.getElementById("btn-overlay");

    this._messageTimer = null;

    this._buildTowerBar();
    this._wire();
  }

  _buildTowerBar() {
    this.towerBar.innerHTML = "";
    this.towerButtons = {};
    for (const id of TOWER_ORDER) {
      const t = TOWERS[id];
      const btn = document.createElement("div");
      btn.className = "tower-btn";
      btn.dataset.type = id;
      btn.innerHTML = `
        <div class="icon" style="background: radial-gradient(circle at 35% 30%, ${t.glow}, ${t.color} 60%, #000 110%);"></div>
        <div class="name">${t.name}</div>
        <div class="cost">${t.cost}G</div>
      `;
      btn.addEventListener("click", () => this.game.selectTowerType(id));
      this.towerBar.appendChild(btn);
      this.towerButtons[id] = btn;
    }
  }

  _wire() {
    this.btnStart.addEventListener("click", () => this.game.startWave());
    this.btnPause.addEventListener("click", () => {
      this.game.paused = !this.game.paused;
      this.btnPause.textContent = this.game.paused ? "▶" : "II";
    });
    this.btnSpeed.addEventListener("click", () => {
      const speeds = [1, 2, 3];
      const i = (speeds.indexOf(this.game.speed) + 1) % speeds.length;
      this.game.speed = speeds[i];
      this.btnSpeed.textContent = this.game.speed + "x";
    });
    this.btnUpgrade.addEventListener("click", () => this.game.upgradeSelected());
    this.btnSell.addEventListener("click", () => this.game.sellSelected());
    this.btnOverlay.addEventListener("click", () => {
      this.hideOverlay();
      this.game.startNewGame();
    });
  }

  update() {
    const g = this.game;
    this.gold.textContent = g.gold;
    this.lives.textContent = g.lives;
    this.wave.textContent = g.wave;

    // Tower button affordability + selection state
    for (const id of TOWER_ORDER) {
      const btn = this.towerButtons[id];
      const t = TOWERS[id];
      btn.classList.toggle("selected", g.placingType === id);
      btn.classList.toggle("disabled", g.gold < t.cost);
    }

    // Start button state
    if (g.waveActive) {
      this.btnStart.classList.remove("ready");
      this.btnStart.classList.add("in-wave");
      this.btnStart.textContent = "WAVE " + g.wave;
    } else {
      this.btnStart.classList.add("ready");
      this.btnStart.classList.remove("in-wave");
      this.btnStart.textContent = g.wave === 0 ? "START" : "NEXT WAVE";
    }

    // Selected tower panel
    if (g.selectedTower) {
      const tower = g.selectedTower;
      const s = tower.stats();
      this.selPanel.classList.remove("hidden");
      this.selName.textContent = tower.type.name;
      this.selLevel.textContent = tower.level;
      this.selDmg.textContent = s.dmg;
      this.selRng.textContent = s.range.toFixed(1);
      this.selRpm.textContent = (s.fireRate * 60).toFixed(0);
      const uc = tower.upgradeCost();
      if (uc === null) {
        this.btnUpgrade.classList.add("disabled");
        this.upgradeCost.textContent = "MAX";
      } else {
        this.btnUpgrade.classList.toggle("disabled", g.gold < uc);
        this.upgradeCost.textContent = uc;
      }
      this.sellValue.textContent = tower.sellValue();
    } else {
      this.selPanel.classList.add("hidden");
    }
  }

  showMessage(text, kind = "") {
    this.message.textContent = text;
    this.message.className = "show " + kind;
    if (this._messageTimer) clearTimeout(this._messageTimer);
    this._messageTimer = setTimeout(() => {
      this.message.className = "hidden";
    }, 1500);
  }

  showOverlay(title, text, button = "PLAY") {
    this.overlayTitle.textContent = title;
    this.overlayText.textContent = text;
    this.btnOverlay.textContent = button;
    this.overlay.classList.remove("hidden");
  }

  hideOverlay() {
    this.overlay.classList.add("hidden");
  }
}

// ============================================================
// game.js
// ============================================================

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.grid = new Grid();
    this.camera = new Camera(this.grid);

    this.gold = ECONOMY.startingGold;
    this.lives = ECONOMY.startingLives;
    this.wave = 0;

    this.enemies = [];
    this.projectiles = [];
    this.effects = [];

    this.placingType = null;       // tower type being placed (or null)
    this.selectedTower = null;     // a placed tower currently selected
    this.hoverCell = null;         // last tapped cell (for placement preview)

    this.waveActive = false;
    this.waveRunner = null;
    this.gameOver = false;
    this.paused = false;
    this.speed = 1;

    this.ui = new UI(this);
    this.input = new InputManager(canvas, this.camera, (wx, wy, sx, sy) => this._handleTap(wx, wy, sx, sy));

    this._lastTime = performance.now();
    this._resize();
    window.addEventListener("resize", () => this._resize());
    window.addEventListener("orientationchange", () => setTimeout(() => this._resize(), 100));

    // Tile cache for the grid background (rebuilt on resize)
    this._bgPattern = null;
  }

  startNewGame() {
    this.gold = ECONOMY.startingGold;
    this.lives = ECONOMY.startingLives;
    this.wave = 0;
    this.enemies.length = 0;
    this.projectiles.length = 0;
    this.effects.length = 0;
    this.grid.cells.fill(null);
    this.grid.invalidatePath();
    this.placingType = null;
    this.selectedTower = null;
    this.waveActive = false;
    this.waveRunner = null;
    this.gameOver = false;
    this.ui.hideOverlay();
    this.ui.showMessage("Build your first defense!", "good");
  }

  _resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = window.innerWidth;
    const h = window.innerHeight;
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = w + "px";
    this.canvas.style.height = h + "px";
    this.dpr = dpr;
    this.camera.resize(this.canvas.width, this.canvas.height);
  }

  selectTowerType(typeId) {
    if (this.placingType === typeId) {
      this.placingType = null;
    } else {
      this.placingType = typeId;
      this.selectedTower = null;
    }
  }

  _handleTap(wx, wy, sx, sy) {
    const cell = this.grid.worldToCell(wx, wy);
    if (!this.grid.inBounds(cell.col, cell.row)) {
      this.placingType = null;
      this.selectedTower = null;
      return;
    }

    // Tap on existing tower? Select it.
    const existing = this.grid.getTower(cell.col, cell.row);
    if (existing) {
      this.selectedTower = existing;
      this.placingType = null;
      return;
    }

    // Otherwise: try to place
    if (this.placingType) {
      const type = TOWERS[this.placingType];
      if (this.gold < type.cost) {
        this.ui.showMessage("Not enough gold", "warn");
        return;
      }
      if (this.grid.isReserved(cell.col, cell.row)) {
        this.ui.showMessage("Path tile — can't build here", "warn");
        return;
      }
      if (!this.grid.canPlace(cell.col, cell.row)) {
        this.ui.showMessage("Would block path", "warn");
        return;
      }
      const tower = new Tower(this.placingType, cell.col, cell.row);
      this.grid.placeTower(cell.col, cell.row, tower);
      this.gold -= type.cost;
      this._updateEnemyPaths();
    } else {
      this.selectedTower = null;
    }
  }

  upgradeSelected() {
    const t = this.selectedTower;
    if (!t) return;
    const cost = t.upgradeCost();
    if (cost === null) { this.ui.showMessage("Already max level", "warn"); return; }
    if (this.gold < cost) { this.ui.showMessage("Not enough gold", "warn"); return; }
    this.gold -= cost;
    t.upgrade();
    this.ui.showMessage(`${t.type.name} → Lv ${t.level}`, "good");
  }

  sellSelected() {
    const t = this.selectedTower;
    if (!t) return;
    this.gold += t.sellValue();
    this.grid.removeTower(t.col, t.row);
    this.selectedTower = null;
    this._updateEnemyPaths();
  }

  startWave() {
    if (this.waveActive || this.gameOver) return;
    this.wave++;
    const spec = buildWave(this.wave);
    this.waveRunner = new WaveRunner(spec);
    this.waveActive = true;
    this.ui.showMessage("Wave " + this.wave, "good");
    this._updateEnemyPaths();
  }

  _updateEnemyPaths() {
    const path = this.grid.computePath();
    if (!path) return;
    for (const e of this.enemies) {
      if (!e.dead && !e.escaped) e.setPath(path);
    }
  }

  _onWaveEnd() {
    this.waveActive = false;
    this.waveRunner = null;
    const bonus = ECONOMY.waveCompleteBonus + this.wave * ECONOMY.waveCompleteScale;
    this.gold += bonus;
    this.ui.showMessage(`Wave clear! +${bonus}G`, "good");
  }

  loop = () => {
    requestAnimationFrame(this.loop);
    const now = performance.now();
    let dt = (now - this._lastTime) / 1000;
    this._lastTime = now;
    if (dt > 0.05) dt = 0.05;       // clamp big stalls
    if (this.paused) dt = 0;

    this.update(dt * this.speed);
    this.render();
    this.ui.update();
  };

  update(dt) {
    if (dt === 0) return;
    if (this.gameOver) return;

    this.camera.applyInertia(dt);

    if (this.waveActive && this.waveRunner) {
      const path = this.grid.computePath();
      this.waveRunner.update(dt, (e) => {
        if (path) e.setPath(path);
        this.enemies.push(e);
      });
    }

    // Enemies
    for (const e of this.enemies) {
      e.update(dt);
      if (e.escaped && !e._counted) {
        this.lives -= e.livesCost;
        e._counted = true;
        if (this.lives <= 0) {
          this.lives = 0;
          this.gameOver = true;
          this.ui.showOverlay("Defeat", `You held out until wave ${this.wave}.`, "TRY AGAIN");
        }
      }
    }

    // Towers
    this.grid.forEachTower((t) => t.update(dt, this.enemies, this.projectiles));

    // Projectiles
    for (const p of this.projectiles) p.update(dt, this.enemies, this.effects);

    // Reward gold for killed enemies
    for (const e of this.enemies) {
      if (e.dead && !e._rewarded) {
        e._rewarded = true;
        this.gold += e.reward;
      }
    }

    // Cull dead/escaped
    this.enemies = this.enemies.filter(e => !(e.dead && e._rewarded) && !(e.escaped && e._counted));
    this.projectiles = this.projectiles.filter(p => !p.dead);

    // Effects
    for (const fx of this.effects) fx.t -= dt;
    this.effects = this.effects.filter(fx => fx.t > 0);

    // Wave end?
    if (this.waveActive && this.waveRunner?.done && this.enemies.length === 0) {
      this._onWaveEnd();
    }
  }

  // -------------- RENDER --------------

  render() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;

    // Sky gradient background
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#0d1228");
    grad.addColorStop(1, "#060814");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // World transform
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(this.camera.zoom, this.camera.zoom);
    ctx.translate(-this.camera.x, -this.camera.y);

    this._renderGrid(ctx);
    this._renderPath(ctx);
    this._renderSpawnExit(ctx);
    this._renderTowers(ctx);
    this._renderRangePreview(ctx);
    this._renderEnemies(ctx);
    this._renderProjectiles(ctx);
    this._renderEffects(ctx);

    ctx.restore();
  }

  _renderGrid(ctx) {
    const tile = GRID.tileSize;
    const ww = this.grid.worldWidth();
    const wh = this.grid.worldHeight();
    // Field tint
    ctx.fillStyle = "#13182e";
    ctx.fillRect(0, 0, ww, wh);

    // Subtle dark band marking the column where spawn/exit sits
    ctx.fillStyle = "rgba(110, 200, 255, 0.04)";
    ctx.fillRect(GRID.spawnCol * tile, 0, tile, wh);

    // Grid lines (only when zoomed in enough to be useful)
    if (this.camera.zoom > 0.6) {
      ctx.strokeStyle = "rgba(255,255,255,0.05)";
      ctx.lineWidth = 1 / this.camera.zoom;
      ctx.beginPath();
      for (let c = 0; c <= this.grid.cols; c++) {
        ctx.moveTo(c * tile, 0); ctx.lineTo(c * tile, wh);
      }
      for (let r = 0; r <= this.grid.rows; r++) {
        ctx.moveTo(0, r * tile); ctx.lineTo(ww, r * tile);
      }
      ctx.stroke();
    }

    // Frame
    ctx.strokeStyle = "rgba(138,124,255,0.4)";
    ctx.lineWidth = 2 / this.camera.zoom;
    ctx.strokeRect(0, 0, ww, wh);
  }

  _renderSpawnExit(ctx) {
    const tile = GRID.tileSize;
    const drawArrow = (cx, cy, dir, color) => {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(dir);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(0, -tile * 0.35);
      ctx.lineTo(tile * 0.3, tile * 0.2);
      ctx.lineTo(0, tile * 0.05);
      ctx.lineTo(-tile * 0.3, tile * 0.2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    };
    const sc = this.grid.cellCenterWorld(GRID.spawnCol, 0);
    const ec = this.grid.cellCenterWorld(GRID.exitCol, GRID.rows - 1);
    // Spawn marker
    ctx.fillStyle = "rgba(110,200,255,0.18)";
    ctx.fillRect(sc.x - tile/2, sc.y - tile/2, tile, tile);
    drawArrow(sc.x, sc.y, Math.PI, "#6ec8ff");
    // Exit marker
    ctx.fillStyle = "rgba(255,107,107,0.18)";
    ctx.fillRect(ec.x - tile/2, ec.y - tile/2, tile, tile);
    drawArrow(ec.x, ec.y, 0, "#ff6b6b");
  }

  _renderPath(ctx) {
    const path = this.grid.computePath();
    if (!path || path.length < 2) return;
    const tile = GRID.tileSize;
    ctx.save();
    ctx.strokeStyle = "rgba(255,204,85,0.18)";
    ctx.lineWidth = tile * 0.55;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i < path.length; i++) {
      const p = path[i];
      const x = p.col * tile + tile / 2;
      const y = p.row * tile + tile / 2;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  _renderTowers(ctx) {
    const tile = GRID.tileSize;
    this.grid.forEachTower((t) => {
      const c = t.centerWorld();
      const lvl = t.level;
      const stats = t.stats();
      // Base platform
      ctx.save();
      ctx.translate(c.x, c.y);

      // Platform shadow
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.ellipse(0, tile * 0.18, tile * 0.42, tile * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();

      // Base
      ctx.fillStyle = "#1a2244";
      ctx.strokeStyle = t.type.color;
      ctx.lineWidth = 1.5;
      const base = tile * (0.34 + lvl * 0.02);
      this._roundRect(ctx, -base, -base, base * 2, base * 2, tile * 0.12);
      ctx.fill(); ctx.stroke();

      // Element ring (more elaborate as level increases)
      const ringR = tile * (0.18 + lvl * 0.03);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, ringR * 1.6);
      grad.addColorStop(0, t.type.glow);
      grad.addColorStop(0.5, t.type.color);
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, ringR * 1.4, 0, Math.PI * 2);
      ctx.fill();

      // Level rings
      ctx.strokeStyle = t.type.glow;
      ctx.globalAlpha = 0.6;
      for (let i = 0; i < lvl; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, ringR + i * 2 + 4, 0, Math.PI * 2);
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // Turret barrel rotates toward target
      ctx.rotate(t.angle);
      const barrelLen = tile * (0.34 + lvl * 0.05);
      const barrelW = tile * (0.1 + lvl * 0.015);
      ctx.fillStyle = "#2a3358";
      ctx.fillRect(0, -barrelW / 2, barrelLen, barrelW);
      ctx.fillStyle = t.type.color;
      ctx.fillRect(barrelLen - barrelW, -barrelW / 2 - 1, barrelW, barrelW + 2);

      // Muzzle flash
      if (t.firePulse > 0) {
        const a = t.firePulse / 0.12;
        ctx.fillStyle = `rgba(255,230,160,${a})`;
        ctx.beginPath();
        ctx.arc(barrelLen, 0, tile * 0.22, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Level pip dots
      ctx.fillStyle = t.type.glow;
      for (let i = 0; i < lvl; i++) {
        ctx.beginPath();
        ctx.arc(c.x - (lvl - 1) * 3 + i * 6, c.y + tile * 0.42, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  _renderRangePreview(ctx) {
    const tile = GRID.tileSize;

    // Selected tower's range
    if (this.selectedTower) {
      const t = this.selectedTower;
      const c = t.centerWorld();
      const r = t.rangeWorld();
      ctx.fillStyle = "rgba(138,124,255,0.10)";
      ctx.strokeStyle = "rgba(138,124,255,0.55)";
      ctx.lineWidth = 1.5 / this.camera.zoom;
      ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }

    // Placement preview: nothing yet — could add follow-finger preview later
  }

  _renderEnemies(ctx) {
    for (const e of this.enemies) {
      if (e.dead || e.escaped) continue;
      ctx.save();
      ctx.translate(e.x, e.y);
      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.beginPath();
      ctx.ellipse(0, e.radius * 0.6, e.radius * 0.9, e.radius * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      // Body
      const grad = ctx.createRadialGradient(-e.radius * 0.3, -e.radius * 0.3, e.radius * 0.1, 0, 0, e.radius);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.25, e.color);
      grad.addColorStop(1, shadeColor(e.color, -0.4));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
      // Outline
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = e.flash > 0 ? "#ffffff" : shadeColor(e.color, -0.5);
      ctx.stroke();
      // Slow indicator
      if (e.slow > 0) {
        ctx.strokeStyle = "rgba(123,200,255,0.9)";
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(0, 0, e.radius + 3, 0, Math.PI * 2); ctx.stroke();
      }
      // Stun indicator
      if (e.stunTimer > 0) {
        ctx.fillStyle = "#ffd24a";
        ctx.beginPath();
        ctx.arc(0, -e.radius - 6, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // HP bar
      const w = Math.max(14, e.radius * 2.4);
      const hpFrac = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(e.x - w / 2 - 1, e.y - e.radius - 9, w + 2, 4);
      ctx.fillStyle = hpFrac > 0.5 ? "#6fe28a" : (hpFrac > 0.25 ? "#ffcc55" : "#ff5577");
      ctx.fillRect(e.x - w / 2, e.y - e.radius - 8, w * hpFrac, 2);
    }
  }

  _renderProjectiles(ctx) {
    for (const p of this.projectiles) {
      if (p.dead) continue;
      // Trail
      for (let i = 0; i < p.trail.length; i++) {
        const t = p.trail[i];
        const a = Math.max(0, t.t / 0.18);
        ctx.fillStyle = `rgba(255,255,255,${a * 0.4})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 1.5 + i * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2); ctx.fill();
      // Glow
      ctx.fillStyle = `rgba(255,255,255,0.45)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  _renderEffects(ctx) {
    for (const fx of this.effects) {
      const a = Math.max(0, fx.t / fx.max);
      if (fx.type === "hit") {
        ctx.strokeStyle = fx.color;
        ctx.globalAlpha = a;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, fx.r * (1.4 - a), 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (fx.type === "splash") {
        const grad = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, fx.r);
        grad.addColorStop(0, `rgba(255,180,80,${0.55 * a})`);
        grad.addColorStop(1, "rgba(255,180,80,0)");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r * (1.2 - a * 0.5), 0, Math.PI * 2);
        ctx.fill();
      } else if (fx.type === "chain") {
        ctx.strokeStyle = fx.color;
        ctx.globalAlpha = a;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const segs = 6;
        const dx = (fx.x2 - fx.x1) / segs, dy = (fx.y2 - fx.y1) / segs;
        ctx.moveTo(fx.x1, fx.y1);
        for (let i = 1; i < segs; i++) {
          const jx = (Math.random() - 0.5) * 6;
          const jy = (Math.random() - 0.5) * 6;
          ctx.lineTo(fx.x1 + dx * i + jx, fx.y1 + dy * i + jy);
        }
        ctx.lineTo(fx.x2, fx.y2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}

function shadeColor(hex, lum) {
  // hex like "#aabbcc"
  let c = hex.replace("#", "");
  if (c.length === 3) c = c.split("").map(x => x + x).join("");
  const r = Math.max(0, Math.min(255, parseInt(c.substr(0, 2), 16) + Math.round(255 * lum)));
  const g = Math.max(0, Math.min(255, parseInt(c.substr(2, 2), 16) + Math.round(255 * lum)));
  const b = Math.max(0, Math.min(255, parseInt(c.substr(4, 2), 16) + Math.round(255 * lum)));
  return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
}
